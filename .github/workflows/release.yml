name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish release & deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check CHANGELOG.md entry exists for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Matches both formats: '## [1.1.0] - 2026-08-09' (hand-written) and
          # '## [1.1.0](compare-url) (2026-08-09)' (generated by release-please)
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for version ${VERSION}. Add a '## [${VERSION}]' section (see RELEASES.md) before tagging."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.8
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build

      - name: Package static site
        run: |
          mkdir -p dist
          tar -czf "dist/bankdesign-${{ github.ref_name }}.tar.gz" -C build .

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { in_entry = 1 }
            in_entry && /^## / && $0 !~ "^## \\[" version "\\]" { exit }
            # Stop before markdown link-reference definitions like [1.0.0]: url
            in_entry && /^\[[^]]*\]:/ { exit }
            in_entry { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            printf 'See [CHANGELOG.md](CHANGELOG.md) for the full release notes.\n' > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          body_path: release_body.md
          files: dist/bankdesign-*.tar.gz
          fail_on_unmatched_files: true

      - name: Deploy to Netlify (production)
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        run: bunx netlify-cli@27.1.1 deploy --dir=build --prod --message="Release ${{ github.ref_name }}"

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.8
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export for GitHub Pages
        run: NEXT_PUBLIC_BASE_PATH="/${{ github.event.repository.name }}" bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
