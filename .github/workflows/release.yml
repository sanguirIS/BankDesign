name: Release

# Third-party actions are pinned to a full commit SHA: release tags are
# mutable, and a moved tag would run unreviewed code with this workflow's
# token. Dependabot (.github/dependabot.yml) keeps the pins updated.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  release:
    name: Build, publish release & deploy to Netlify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
      NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check CHANGELOG.md entry exists for this tag
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          # Matches both formats: '## [1.1.0] - 2026-08-09' (hand-written) and
          # '## [1.1.0](compare-url) (2026-08-09)' (generated by release-please)
          if ! grep -qF "## [$VERSION]" CHANGELOG.md; then
            echo "::error::CHANGELOG.md has no entry for version ${VERSION}. Add a '## [${VERSION}]' section (see RELEASES.md) before tagging."
            exit 1
          fi

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.8
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export
        run: bun run build

      - name: Package static site
        # NOTE: ref names are attacker-influenced data (quote characters, `$`,
        # `;` and backticks are legal in git refs) - never interpolate them into
        # a `run:` script. Pass them through `env:` instead.
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          mkdir -p dist
          tar -czf "dist/bankdesign-${RELEASE_TAG}.tar.gz" -C build .

      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v version="$VERSION" '
            $0 ~ "^## \\[" version "\\]" { in_entry = 1 }
            in_entry && /^## / && $0 !~ "^## \\[" version "\\]" { exit }
            # Stop before markdown link-reference definitions like [1.0.0]: url
            in_entry && /^\[[^]]*\]:/ { exit }
            in_entry { print }
          ' CHANGELOG.md > release_body.md
          if [ ! -s release_body.md ]; then
            printf 'See [CHANGELOG.md](CHANGELOG.md) for the full release notes.\n' > release_body.md
          fi

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          body_path: release_body.md
          files: dist/bankdesign-*.tar.gz
          fail_on_unmatched_files: true

      - name: Deploy to Netlify (production)
        if: env.NETLIFY_AUTH_TOKEN != '' && env.NETLIFY_SITE_ID != ''
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: bunx netlify-cli@27.1.1 deploy --dir=build --prod --message="Release ${RELEASE_TAG}"

  deploy-pages:
    name: Deploy to GitHub Pages
    needs: release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.2.8
          cache: true

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Build static export for GitHub Pages
        env:
          REPO_NAME: ${{ github.event.repository.name }}
        run: NEXT_PUBLIC_BASE_PATH="/${REPO_NAME}" bun run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
