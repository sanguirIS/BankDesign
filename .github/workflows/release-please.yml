name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: google-github-actions/release-please-action@v4
        with:
          # Use a PAT so the tag it creates triggers the Release workflow
          # (tags created with GITHUB_TOKEN don't fire downstream tag-push runs).
          # Add RELEASE_PLEASE_TOKEN (repo scope) to repo secrets; falls back
          # to GITHUB_TOKEN if unset.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: node
          skip-github-release: true
