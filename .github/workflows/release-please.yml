name: release-please

# Third-party actions are pinned to a full commit SHA: release tags are
# mutable, and a moved tag would run unreviewed code with this workflow's
# token. Dependabot (.github/dependabot.yml) keeps the pins updated.

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          # Use a PAT so the tag it creates triggers the Release workflow
          # (tags created with GITHUB_TOKEN don't fire downstream tag-push runs).
          # Add RELEASE_PLEASE_TOKEN to repo secrets; falls back to GITHUB_TOKEN
          # if unset. Prefer a *fine-grained* PAT scoped to this repository with
          # only "Contents: Read and write" and "Pull requests: Read and write".
          # A classic token with the full `repo` scope also works but grants far
          # more than this workflow needs - avoid it if you can.
          token: ${{ secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          release-type: node
          skip-github-release: true
