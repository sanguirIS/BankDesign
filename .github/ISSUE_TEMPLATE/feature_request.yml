name: ✨ Feature request
description: Suggest an idea for BankDesign
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Before submitting, please
        [search existing issues](https://github.com/sanguirIS/BankDesign/issues)
        to avoid duplicates. Feature requests are discussed before implementation.

        > **⚠️ Security issues:** do not report vulnerabilities here — see
        > [SECURITY.md](https://github.com/sanguirIS/BankDesign/blob/main/SECURITY.md).
  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve, and who benefits from it?
      placeholder: As a user, I want to ... because ...
    validations:
      required: true
  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: A clear and concise description of what you'd like to happen.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any workarounds or alternative approaches you've thought of.
  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: Roughly how large do you expect this feature to be?
      options:
        - Small (a few hours)
        - Medium (a day or two)
        - Large (multiple days)
        - Not sure
  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Add mockups, sketches, or examples that help explain the idea.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      description: Please confirm the following before submitting.
      options:
        - label: I searched for similar existing issues and found none
          required: true
        - label: I am submitting a feature request (not a support question or bug)
          required: true
