name: 🐛 Bug report
description: Report a bug to help us improve BankDesign
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Before submitting, please
        [search existing issues](https://github.com/sanguirIS/BankDesign/issues)
        to avoid duplicates.

        > **⚠️ Security issues:** do not report vulnerabilities here. Follow
        > [SECURITY.md](https://github.com/sanguirIS/BankDesign/blob/main/SECURITY.md)
        > and use GitHub's
        > [private vulnerability reporting](https://github.com/sanguirIS/BankDesign/security/advisories/new)
        > instead, so the issue stays private until a fix is released.
  - type: textarea
    id: description
    attributes:
      label: Describe the bug
      description: A clear and concise description of what the bug is.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can we reproduce the issue?
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. Scroll down to '...'
        4. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      description: What actually happened instead?
    validations:
      required: true
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, add screenshots (light and dark mode for UI issues) to help explain the problem.
  - type: dropdown
    id: severity
    attributes:
      label: Severity
      description: How severely does this bug affect you?
      options:
        - Blocker (app unusable)
        - High (major feature broken)
        - Medium (partial functionality broken)
        - Low (cosmetic / minor)
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser
      description: e.g. Chrome 126, Firefox 127, Safari 17
  - type: input
    id: os
    attributes:
      label: Operating system
      description: e.g. macOS 14, Windows 11, Ubuntu 24.04
  - type: input
    id: node
    attributes:
      label: Node version
      description: Output of `node --version` (e.g. v20.15.0)
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      description: Please confirm the following before submitting.
      options:
        - label: I searched for similar existing issues and found none
          required: true
        - label: I included steps to reproduce the issue
          required: true
        - label: I provided environment details (browser, OS, Node version)
          required: true
